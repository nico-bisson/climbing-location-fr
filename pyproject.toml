[project]
name = "climbing-location-fr"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Nicolas Bisson", email = "nicolas.bisson31@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "duckdb>=1.5.6",
    "folium>=0.20.0",
    "marimo>=0.25.2",
    "matplotlib>=3.11.2",
    "pandas>=3.0.6",
    "plotly>=7.1.0",
    "requests>=2.34.2",
    "seaborn>=0.13.2",
    "sqlglot>=30.23.0",
    "streamlit>=1.66.1",
    "streamlit-folium>=0.27.4",
    "tqdm>=4.70.1",
]

[project.scripts]
climbing-location-fr = "climbing_location_fr:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.1",
]
[tool.ruff.format]
skip-magic-trailing-comma = true
